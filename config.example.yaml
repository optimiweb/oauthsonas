issuer: http://127.0.0.1:8181
api_audience: https://api.example.test
token_ttl: 15m
authorization_code_ttl: 5m
refresh_token_ttl: 8h

# Claim names default to bare keys (roles, memberships, org_id).
# Override them when your relying party expects different keys
# (for example Auth0-style namespaced custom claims).
# claims:
#   roles: roles
#   memberships: memberships
#   org_id: org_id
#
# claims:
#   roles: https://example.com/roles
#   memberships: https://example.com/memberships
#   org_id: org_id

# Optional: reject personas that use role names outside this list.
# allowed_roles:
#   - platform-admin
#   - operator
#   - account-manager
#   - customer-admin
#   - customer-viewer

clients:
  - id: dashboard
    name: Example Dashboard
    public: true
    redirect_uris:
      - http://127.0.0.1:5173/auth/callback
    post_logout_redirect_uris:
      - http://127.0.0.1:5173/
    allowed_origins:
      - http://127.0.0.1:5173

personas:
  # Staff / global: roles only, no organization_id.
  - id: platform-admin
    subject: oauthsonas|platform-admin
    email: platform-admin@example.test
    name: Platform Admin
    roles: [platform-admin]

  - id: operator
    subject: oauthsonas|operator
    email: operator@example.test
    name: Operations User
    roles: [operator]

  # Multi-org staff: memberships without a single active org_id.
  - id: account-manager-acme
    subject: oauthsonas|account-manager-acme
    email: account-manager@example.test
    name: Acme Account Manager
    roles: [account-manager]
    memberships: [org_acme]

  # Customer personas: organization_id becomes the org_id claim.
  - id: acme-admin
    subject: oauthsonas|acme-admin
    email: admin@acme.example.test
    name: Acme Administrator
    organization_id: org_acme
    roles: [customer-admin]

  - id: acme-viewer
    subject: oauthsonas|acme-viewer
    email: viewer@acme.example.test
    name: Acme Viewer
    organization_id: org_acme
    roles: [customer-viewer]

  - id: bravo-admin
    subject: oauthsonas|bravo-admin
    email: admin@bravo.example.test
    name: Bravo Administrator
    organization_id: org_bravo
    roles: [customer-admin]
